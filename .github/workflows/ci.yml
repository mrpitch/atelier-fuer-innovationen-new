name: CI

# Every pull request, whatever its base branch, so epic sub-issue PRs get a run too. No path
# filters, because a required check that never starts leaves the PR pending forever.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # HUSKY=0 makes husky's prepare script skip the hook install. The runner never commits.
  HUSKY: '0'

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # Internal links only: --offline skips network requests, so an external site being down
      # doesn't fail an unrelated PR. --root-dir resolves root-relative hrefs (e.g. "/idee")
      # against the static export's own directory; lychee requires an absolute path for it.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/out 'out/**/*.html'
          fail: true
